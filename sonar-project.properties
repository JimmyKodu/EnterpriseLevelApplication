sonar.projectKey=enterpriseapp
sonar.projectName=Enterprise Application
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/lib/**,**/*.css,**/*.js
sonar.test.exclusions=**/bin/**,**/obj/**

# Coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverage.exclusions=**/Program.cs,**/Startup.cs

# Language
sonar.language=cs

# Encoding
sonar.sourceEncoding=UTF-8
